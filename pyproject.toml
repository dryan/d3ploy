[project]
name = "d3ploy"
version = "4.4.4"
description = "Easily deploy to S3 with multiple environment support."
authors = [
    {name = "dryan", email = "dryan@users.noreply.github.com"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.35.58",
    "packaging>=24.2",
    "pathspec>=0.12.1",
    "questionary>=2.1.1",
    "rich>=14.2.0",
    "typer>=0.20.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
homepage = "https://github.com/dryan/d3ploy"
repository = "https://github.com/dryan/d3ploy"
documentation = "https://github.com/dryan/d3ploy#readme"

[project.scripts]
d3ploy = "d3ploy:cli"

[tool.ruff.lint.isort]
force-single-line = true

[dependency-groups]
dev = [
    "boto3-stubs[cloudfront,s3]>=1.40.76",
    "briefcase>=0.3.25",
    "ipython>=8.29.0",
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.7.3",
    "ty>=0.0.1a27",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling",]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=d3ploy",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=20",  # Temporarily lowered during test migration
    "-v",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.briefcase]
project_name = "D3ploy"
bundle = "com.dryan"
version = "4.4.4"
url = "https://github.com/dryan/d3ploy"
license.file = "LICENSE"
author = "dryan"
author_email = "dryan@users.noreply.github.com"
description = "Easily deploy to S3 with multiple environment support"

[tool.ty]
# Type checking configuration for ty (pyright CLI wrapper)
# See: https://github.com/astral-sh/ty

[tool.pyright]
# Pyright configuration (used by ty)
include = ["d3ploy", "tests"]

[tool.briefcase.app.d3ploy]
formal_name = "D3ploy"
description = "Easily deploy to S3 with multiple environment support."
long_description = """
D3ploy is a command-line tool that makes it easy to deploy static sites and files 
to Amazon S3 with support for multiple environments. It supports features like:

- Multiple environment configurations
- File exclusion patterns and .gitignore support
- CloudFront invalidation
- Cache control headers
- Parallel uploads for speed
- Dry-run mode
- File deletion sync
"""
sources = ["d3ploy"]
test_sources = ["tests"]

requires = [
    "boto3>=1.35.58",
    "packaging>=24.2",
    "pathspec>=0.12.1",
    "rich>=14.2.0",
    "typer>=0.20.0",
]

console_app = true

[tool.briefcase.app.d3ploy.macOS]
requires = [
    "boto3>=1.35.58",
    "packaging>=24.2",
    "pathspec>=0.12.1",
    "rich>=14.2.0",
    "typer>=0.20.0",
]

[tool.briefcase.app.d3ploy.linux]
requires = [
    "boto3>=1.35.58",
    "packaging>=24.2",
    "pathspec>=0.12.1",
    "rich>=14.2.0",
    "typer>=0.20.0",
]

[tool.briefcase.app.d3ploy.windows]
requires = [
    "boto3>=1.35.58",
    "packaging>=24.2",
    "pathspec>=0.12.1",
    "rich>=14.2.0",
    "typer>=0.20.0",
]
