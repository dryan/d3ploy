pre-commit:
  parallel: false
  commands:
    # Format files
    prettier:
      glob: "*.{js,ts,json,css,html,md,yml,yaml}"
      run: |
        for f in {staged_files}; do
          [ -f "$f" ] && [ ! -L "$f" ] && npx prettier --write "$f"
        done
      stage_fixed: true

    # Format and lint Python (if Python files exist)
    ruff-format:
      glob: "*.py"
      run: |
        FILES=$(for f in {staged_files}; do
          [ -f "$f" ] && echo "$f"
        done)
        [ -z "$FILES" ] || ruff format $FILES
      stage_fixed: true

    ruff-check:
      glob: "*.py"
      run: |
        FILES=$(for f in {staged_files}; do
          [ -f "$f" ] && echo "$f"
        done)
        [ -z "$FILES" ] || ruff check --fix $FILES
      stage_fixed: true

    # Check for dead/unused code in Python
    vulture:
      glob: "*.py"
      run: |
        FILES=$(for f in {staged_files}; do
          [ -f "$f" ] && echo "$f"
        done)
        [ -z "$FILES" ] || uv run vulture $FILES
      stage_fixed: false # vulture only reports, doesn't fix
