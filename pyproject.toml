[project]
name = "d3ploy"
version = "4.4.3"
description = "Easily deploy to S3 with multiple environment support."
authors = [
    {name = "dryan", email = "dryan@users.noreply.github.com"},
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.35.58",
    "packaging>=24.2",
    "pathspec>=0.12.1",
    "rich[extras]>=14.2.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
homepage = "https://github.com/dryan/d3ploy"
repository = "https://github.com/dryan/d3ploy"
documentation = "https://github.com/dryan/d3ploy#readme"

[project.scripts]
d3ploy = "d3ploy:cli"

[tool.ruff.lint.isort]
force-single-line = true

[dependency-groups]
dev = [
    "briefcase>=0.3.25",
    "ipython>=8.29.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.3",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling",]

[tool.pytest.ini_options]
testpaths = ["tests/test*.py"]
addopts = ["--cov=d3ploy", "--cov-report=term-missing", "--cov-report=html", "--cov-fail-under=100"]

[tool.briefcase]
project_name = "D3ploy"
bundle = "com.dryan"
version = "4.4.3"
url = "https://github.com/dryan/d3ploy"
license.file = "LICENSE"
author = "dryan"
author_email = "dryan@users.noreply.github.com"
description = "Easily deploy to S3 with multiple environment support"

[tool.briefcase.app.d3ploy]
formal_name = "D3ploy"
description = "Easily deploy to S3 with multiple environment support."
long_description = """
D3ploy is a command-line tool that makes it easy to deploy static sites and files 
to Amazon S3 with support for multiple environments. It supports features like:

- Multiple environment configurations
- File exclusion patterns and .gitignore support
- CloudFront invalidation
- Cache control headers
- Parallel uploads for speed
- Dry-run mode
- File deletion sync
"""
sources = ["d3ploy"]
test_sources = ["tests"]

requires = [
    "boto3>=1.35.58",
    "packaging>=24.2",
    "pathspec>=0.12.1",
    "rich>=13.9.4",
]

console_app = true

[tool.briefcase.app.d3ploy.macOS]
requires = [
    "boto3>=1.35.58",
    "packaging>=24.2",
    "pathspec>=0.12.1",
    "rich>=13.9.4",
]

[tool.briefcase.app.d3ploy.linux]
requires = [
    "boto3>=1.35.58",
    "packaging>=24.2",
    "pathspec>=0.12.1",
    "rich>=13.9.4",
]

[tool.briefcase.app.d3ploy.windows]
requires = [
    "boto3>=1.35.58",
    "packaging>=24.2",
    "pathspec>=0.12.1",
    "rich>=13.9.4",
]
